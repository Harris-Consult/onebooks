version: '3'

services:
  akaunting:
    image: akaunting/akaunting:latest
    platform: linux/amd64  # Force AMD64 architecture
    container_name: akaunting
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=akaunting
      - DB_USERNAME=akaunting
      - DB_PASSWORD=H@rr!s@20!4
    volumes:
      - akaunting_data:/var/www/html/storage
    ports:
      - "8080:80"
    restart: unless-stopped

  db:
    image: mariadb:10.6  # Better ARM support than MySQL
    container_name: akaunting_db
    environment:
      - MYSQL_ROOT_PASSWORD=H@rr!s@20!4
      - MYSQL_DATABASE=akaunting
      - MYSQL_USER=akaunting
      - MYSQL_PASSWORD=H@rr!s@20!4
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  akaunting_data:
  mysql_data: